name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - uses: astral-sh/setup-uv@v6
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --all-features
      - name: ruff and mypy
        working-directory: plitzer-py
        run: |
          uv venv -p 3.11
          uv pip install ruff mypy numpy pyarrow pytest
          uv run --no-project ruff check python tests
          uv run --no-project ruff format --check python tests
          uv run --no-project mypy python tests

  test:
    # Ordering must be bit-identical across platforms, so test on all three.
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test

  python:
    # The abi3 wheel at its oldest Python, on each platform.
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: astral-sh/setup-uv@v6
      - run: uv venv -p 3.11
      - run: uv pip install maturin pytest numpy pyarrow
      - run: uv run --no-project maturin develop -m plitzer-py/Cargo.toml
      - run: uv run --no-project python -m pytest plitzer-py/tests

  s3:
    # Service containers run only on Linux runners, so S3 is tested here
    # alone. versitygw serves each folder under /data as a bucket. It comes
    # from GHCR, since MinIO no longer publishes images.
    runs-on: ubuntu-latest
    env:
      PLITZER_S3_ENDPOINT: http://127.0.0.1:7070
      PLITZER_S3_BUCKET: plitzer-test
      PLITZER_S3_ACCESS_KEY: test
      PLITZER_S3_SECRET_KEY: testsecret
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Start versitygw
        run: |
          mkdir -p "$RUNNER_TEMP/s3/$PLITZER_S3_BUCKET"
          chmod -R 777 "$RUNNER_TEMP/s3"
          docker run -d --name s3 -p 7070:7070 -v "$RUNNER_TEMP/s3:/data" \
            -e ROOT_ACCESS_KEY="$PLITZER_S3_ACCESS_KEY" \
            -e ROOT_SECRET_KEY="$PLITZER_S3_SECRET_KEY" \
            -e VGW_BACKEND=posix -e VGW_BACKEND_ARGS=/data -e VGW_PORT=:7070 \
            ghcr.io/versity/versitygw:v1.10.0
          for i in $(seq 30); do curl -s -o /dev/null "$PLITZER_S3_ENDPOINT" && exit 0; sleep 1; done
          docker logs s3; exit 1
      - run: cargo test --features s3
      - uses: astral-sh/setup-uv@v6
      - name: Python over S3
        run: |
          uv venv -p 3.11
          uv pip install maturin pytest numpy pyarrow
          uv run --no-project maturin develop -m plitzer-py/Cargo.toml
          uv run --no-project python -m pytest plitzer-py/tests/test_s3.py
      - if: failure()
        run: docker logs s3
